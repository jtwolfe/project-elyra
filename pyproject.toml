[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elyra"
version = "0.1.0"
description = "Elyra — communal assistant (Stretch 1 harness)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional warm microVM isolation. Default install stays hermetic (Fake / host stub).
sandbox = ["microsandbox>=0.6.0"]
# Optional native web search (web_search builtin). Fail-closed without this extra.
search = ["ddgs>=9.0"]
# Optional Playwright browser primitives (host builtins). Also run:
#   playwright install chromium
browser = ["playwright>=1.49"]
# Optional LanceDB MemoryStore backend (Phase 1 fields; no ANN required).
# CI stays on jsonl; enable with memory.backend = "lance".
memory-lance = ["lancedb>=0.20,<0.21", "pyarrow>=14"]
# Optional Omni-Embed-Nemotron encode path (Phase 2 PR8). Hermetic CI never
# requires these; mock encoder always available. Full multimodal may need a
# transformers build with Qwen2.5-Omni support — see spike note.
memory-embed = [
    "torch>=2.2",
    "torchvision>=0.17",  # Qwen2VL video processor path (Nemotron Omni)
    "transformers>=4.51",
    "accelerate>=0.33",
    "Pillow>=10.0",
]

[project.scripts]
elyra = "elyra.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["elyra*"]

[tool.setuptools.package-data]
elyra = ["runtime/web/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "llm: optional live LLM (OpenAI-compat local/remote); skipped when unavailable",
    "live_grok: optional live Grok Build dogfood; skipped unless ELYRA_LIVE_GROK=1",
    "microsandbox: optional live microsandbox smoke (needs KVM + elyra[sandbox])",
    "gpu: optional GPU / real Nemotron encode; skipped when torch/CUDA/model unavailable",
    "memory_embed: optional elyra[memory-embed] path (torch+transformers); may skip",
]
