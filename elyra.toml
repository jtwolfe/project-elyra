# Operator overrides (defaults < this file < data/runtime/* < CLI).
# Phase 2 dogfood: Lance store + semantic meal + real Nemotron embedder.

[memory]
backend = "lance"
enabled = true
write_atoms = true
ladder_enabled = true
# Dogfood: LLM period narratives (template remains fallback on hard-stop / errors)
summary_mode = "llm"
# Allow cascade for 1h→1y without waiting for instance-age unlocks
ladder_age_gates_enabled = false

# Phase 2a directed traversal dogfood (operator on)
directed_traversal_enabled = true
directed_keep_enabled = true
# Durable EdgeStore writes (created_with / in_moment / recalls / …) — product default on
durable_edges_enabled = true

# Phase 2 semantic / embeddings (operator on)
semantic_enabled = true
embed_enabled = true
embed_backend = "nemotron"
embed_model_id = "nvidia/omni-embed-nemotron-3b"
embed_device = "rocm"
# Warm-on-start (KD-EP): pin true even if factory default flips
embed_preload = true
parcels_enabled = true
